stages:
  - build
  - test

variables:
  BUILD_DIR: "build"
  CONFIGURATION: "Release"

before_script:
  - apt-get update && apt-get install -y cmake g++ libgtest-dev build-essential libopencv-dev
  - cd /usr/src/gtest && cmake . && make
  - cp *.a /usr/lib || echo "No .a files found, skipping"
  - cd $CI_PROJECT_DIR

build:
  stage: build
  script:
    - rm -rf $BUILD_DIR
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - cmake .. -DCMAKE_BUILD_TYPE=$CONFIGURATION
    - cmake --build .
  artifacts:
    paths:
      - $BUILD_DIR
    expire_in: 1 hour

test:
  stage: test
  dependencies:
    - build
  script:
    - cd $BUILD_DIR
    - cp ../test.webp .  # Copy image resource if needed
    # Run only tests expected to PASS; skip known failing ones
    - ./test_4_rotate --gtest_output=xml:test-4-rotate-results.xml
    - ./test_blur --gtest_output=xml:test-blur-results.xml
    - ./test_sobel --gtest_output=xml:test-sobel-results.xml
    # Add more passing tests here, exclude intentionally failing tests like test_blur_fail
  artifacts:
    when: always
    reports:
      junit:
        - $BUILD_DIR/test-4-rotate-results.xml
        - $BUILD_DIR/test-blur-results.xml
        - $BUILD_DIR/test-sobel-results.xml
    paths:
      - $BUILD_DIR/*.xml
    expire_in: 1 hour

